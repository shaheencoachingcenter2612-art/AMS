<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AMS | Sign In</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0d6efd,
                #0b1f3a
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
        }

        .login-card {

            width: 100%;
            max-width: 430px;

            background: #ffffff;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.20);
        }

        .logo {

            width: 70px;
            height: 70px;

            background: #0d6efd;

            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            font-size: 28px;
            font-weight: bold;
        }

        .brand-title {

            font-weight: 700;
            text-align: center;

            margin-bottom: 5px;
        }

        .brand-subtitle {

            text-align: center;
            color: #6c757d;

            margin-bottom: 30px;
        }

        .form-label {

            font-weight: 600;
        }

        .form-control {

            padding: 12px;

            border-radius: 10px;
        }

        .btn-login {

            width: 100%;

            padding: 12px;

            border-radius: 10px;

            font-weight: 600;

            font-size: 16px;
        }

        .footer-text {

            text-align: center;

            color: #6c757d;

            font-size: 13px;

            margin-top: 25px;
        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- Logo -->

    <div class="logo">
        AMS
    </div>


    <!-- Heading -->

    <h2 class="brand-title">
        Academic Management System
    </h2>

    <p class="brand-subtitle">
        Sign in to continue
    </p>


    <!-- Messages -->

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-danger">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <!-- Login Form -->

    <form method="POST">

        {% csrf_token %}


        <!-- Username -->

        <div class="mb-3">

            <label
                for="username"
                class="form-label"
            >
                Username
            </label>

            <input
                type="text"
                name="username"
                id="username"
                class="form-control"
                placeholder="Enter your username"
                required
                autofocus
            >

        </div>


        <!-- Password -->

        <div class="mb-4">

            <label
                for="password"
                class="form-label"
            >
                Password
            </label>

            <input
                type="password"
                name="password"
                id="password"
                class="form-control"
                placeholder="Enter your password"
                required
            >

        </div>


        <!-- Login Button -->

        <button
            type="submit"
            class="btn btn-primary btn-login"
        >
            Sign In
        </button>


    </form>


    <div class="footer-text">

        AMS ERP · Academic Management System

    </div>


</div>


</body>

</html>
