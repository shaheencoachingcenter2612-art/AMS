<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>{{ page_title }}</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <h1>{{ page_title }}</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="field">

                {{ form.name.label }}

                {{ form.name }}

                {{ form.name.errors }}

            </div>


            <button type="submit">
                Save Class
            </button>

            <a href="{% url 'academics:classroom_list' %}">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
